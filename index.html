<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>To Do List</title>
    <link rel="stylesheet" href="todo-list.css" />
  </head>
  <body>
    <p class="todoHeading">Todo List</p>

    <div class="todo-input-grid">
      <input placeholder="Todo Name" class="js-inputTodo todo-input-elem" />
      <input type="date" class="js-date-input dueDateTodo" />
      <button class="addTodoBtn js-add-todo">Add</button>
    </div>

    <div class="js-todo-display todo-grid"></div>

    <script src="to-do-list.js"></script>
  </body>
</html>
